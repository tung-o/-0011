<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมสมองกล: ตู้อาเขตนักออกแบบอัลกอริทึม</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* นำเข้าฟอนต์ธีมไซไฟ/อาเขต */
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap');
        
        body { 
            font-family: 'Chakra Petch', sans-serif; 
            background-color: #0f172a; /* พื้นหลังสีน้ำเงินเข้มมาก */
            background-image: 
                linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)), 
                radial-gradient(#334155 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px;
            color: #fff;
            position: relative;
        }

        /* เอฟเฟกต์จอ CRT (เส้นสแกนตู้เกม) */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* ตู้เกม (Main Container) */
        .arcade-cabinet {
            background-color: #000;
            border: 4px solid #d946ef; /* สีชมพู Fuchsia */
            box-shadow: 0 0 20px #d946ef, inset 0 0 20px rgba(217, 70, 239, 0.5);
            border-radius: 16px;
            position: relative;
            z-index: 10;
        }

        /* เอฟเฟกต์ตัวหนังสือเรืองแสง */
        .neon-text-pink {
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #d946ef, 0 0 40px #d946ef;
        }
        .neon-text-cyan {
            text-shadow: 0 0 5px #fff, 0 0 10px #06b6d4, 0 0 20px #06b6d4;
        }
        .neon-text-yellow {
            text-shadow: 0 0 5px #eab308, 0 0 10px #eab308;
        }

        /* เซลล์ในกระดาน */
        .grid-cell { 
            width: 50px; height: 50px; 
            border: 1px solid rgba(6, 182, 212, 0.4); /* ขอบฟ้า Cyan */
            background-color: #0f172a;
            display: flex; align-items: center; justify-content: center; 
            font-size: 24px; 
            box-shadow: inset 0 0 8px rgba(6, 182, 212, 0.1);
        }
        
        .wall { 
            background-color: #ef4444; 
            box-shadow: 0 0 10px #ef4444, inset 0 0 10px #991b1b;
            border: 1px solid #f87171;
            font-size: 20px;
        }

        .goal {
            animation: pulse-glow 1.5s infinite alternate;
        }

        @keyframes pulse-glow {
            from { text-shadow: 0 0 5px #fde047, 0 0 10px #fde047; transform: scale(1); }
            to { text-shadow: 0 0 15px #fef08a, 0 0 25px #fde047; transform: scale(1.1); }
        }

        .robot { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: inline-block; }
        .dir-0 { transform: rotate(0deg); }
        .dir-1 { transform: rotate(90deg); }
        .dir-2 { transform: rotate(180deg); }
        .dir-3 { transform: rotate(-90deg); }

        /* ปุ่มสไตล์ Arcade (กดแล้วยุบ) */
        .arcade-btn {
            border-bottom-width: 6px;
            transition: all 0.1s;
            text-transform: uppercase;
            font-weight: 700;
        }
        .arcade-btn:active {
            border-bottom-width: 0px;
            transform: translateY(6px);
        }
        .arcade-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            border-bottom-width: 6px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-6">

    <div class="arcade-cabinet p-6 w-full max-w-2xl">
        <h1 class="text-3xl font-bold text-center text-white mb-1 neon-text-pink">👾 ALGORITHM ARCADE</h1>
        <p class="text-center text-cyan-400 mb-5 font-semibold text-xl neon-text-cyan" id="level-display">STAGE 1 / 10</p>

        <!-- พื้นที่กระดานเกม -->
        <div class="flex justify-center mb-6">
            <div id="game-board" class="grid gap-1 bg-black p-2 rounded-lg border-2 border-cyan-500 shadow-[0_0_15px_rgba(6,182,212,0.5)]">
                <!-- เซลล์กระดานจะถูกสร้างด้วย JavaScript -->
            </div>
        </div>

        <div id="message-box" class="text-center text-xl font-bold text-yellow-300 h-8 mb-4 neon-text-yellow">
            INSERT COMMANDS TO REACH THE STAR 🌟
        </div>

        <!-- พื้นที่แสดงชุดคำสั่ง -->
        <div class="bg-gray-900 p-4 rounded-lg mb-6 border-2 border-pink-500 min-h-[90px] max-h-[120px] overflow-y-auto shadow-[inset_0_0_10px_rgba(217,70,239,0.3)]">
            <h2 class="text-sm font-bold text-pink-400 mb-2 uppercase tracking-wider">>> Command Sequence :</h2>
            <div id="command-queue" class="flex flex-wrap gap-2">
                <!-- คำสั่งจะแสดงตรงนี้ -->
            </div>
            <p id="empty-queue-text" class="text-gray-500 text-sm mt-1 animate-pulse">[ WAITING FOR INPUT... ]</p>
        </div>

        <!-- ปุ่มควบคุม -->
        <div class="grid grid-cols-3 gap-4 mb-5">
            <button onclick="addCommand('turn-left')" class="arcade-btn bg-purple-600 hover:bg-purple-500 border-purple-900 text-white py-3 rounded-lg shadow-lg text-lg">
                ↺ LEFT
            </button>
            <button onclick="addCommand('forward')" class="arcade-btn bg-cyan-500 hover:bg-cyan-400 border-cyan-700 text-black py-3 rounded-lg shadow-lg text-lg">
                ⬆️ FORWARD
            </button>
            <button onclick="addCommand('turn-right')" class="arcade-btn bg-purple-600 hover:bg-purple-500 border-purple-900 text-white py-3 rounded-lg shadow-lg text-lg">
                RIGHT ↻
            </button>
        </div>

        <div class="flex gap-4">
            <button onclick="clearCommands()" class="arcade-btn flex-1 bg-red-500 hover:bg-red-400 border-red-800 text-white py-3 rounded-lg shadow-lg text-lg">
                🗑️ CLEAR
            </button>
            <button onclick="runAlgorithm()" id="run-btn" class="arcade-btn flex-2 w-2/3 bg-yellow-400 hover:bg-yellow-300 border-yellow-600 text-black py-3 rounded-lg shadow-lg text-xl tracking-wider">
                ▶️ EXECUTE
            </button>
        </div>
    </div>

    <script>
        // ระบบเสียง (Web Audio API) สไตล์ 8-bit
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, vol = 0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; // square เหมาะกับ 8-bit ที่สุด
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const sounds = {
            click: () => playTone(880, 'square', 0.1, 0.05),
            move: () => playTone(220, 'square', 0.15, 0.05),
            turn: () => playTone(440, 'square', 0.1, 0.05),
            win: () => {
                playTone(523.25, 'square', 0.1); 
                setTimeout(() => playTone(659.25, 'square', 0.1), 150); 
                setTimeout(() => playTone(783.99, 'square', 0.3), 300); 
                setTimeout(() => playTone(1046.50, 'square', 0.4), 450); 
            },
            lose: () => {
                playTone(150, 'sawtooth', 0.3, 0.1);
                setTimeout(() => playTone(100, 'sawtooth', 0.4, 0.1), 200);
            }
        };

        // ข้อมูลด่าน 10 ด่าน
        const levels = [
            { start: {x: 1, y: 3, dir: 0}, goal: {x: 4, y: 3}, walls: [] },
            { start: {x: 1, y: 1, dir: 0}, goal: {x: 4, y: 4}, walls: [{x:4,y:1},{x:4,y:2},{x:4,y:3}] },
            { start: {x: 1, y: 4, dir: 0}, goal: {x: 4, y: 1}, walls: [{x:2,y:4},{x:2,y:3},{x:3,y:1},{x:4,y:2}] },
            { start: {x: 0, y: 0, dir: 1}, goal: {x: 5, y: 5}, walls: [{x:0,y:2},{x:1,y:2},{x:2,y:2},{x:3,y:2},{x:3,y:4},{x:4,y:4},{x:5,y:4}] },
            { start: {x: 2, y: 5, dir: 3}, goal: {x: 2, y: 0}, walls: [{x:2,y:3},{x:1,y:3},{x:3,y:3},{x:1,y:1},{x:3,y:1}] },
            { start: {x: 0, y: 3, dir: 0}, goal: {x: 5, y: 3}, walls: [{x:2,y:1},{x:2,y:2},{x:2,y:3},{x:4,y:3},{x:4,y:4},{x:4,y:5}] },
            { start: {x: 1, y: 1, dir: 0}, goal: {x: 4, y: 4}, walls: [{x:2,y:1},{x:2,y:2},{x:2,y:4},{x:3,y:4},{x:4,y:2}] },
            { start: {x: 0, y: 5, dir: 0}, goal: {x: 5, y: 0}, walls: [{x:1,y:5},{x:1,y:4},{x:3,y:5},{x:3,y:4},{x:1,y:2},{x:2,y:2},{x:3,y:2},{x:4,y:2},{x:5,y:2}] },
            { start: {x: 0, y: 0, dir: 0}, goal: {x: 2, y: 2}, walls: [{x:1,y:0},{x:1,y:1},{x:3,y:0},{x:3,y:1},{x:3,y:2},{x:3,y:3},{x:1,y:3},{x:1,y:4},{x:1,y:5},{x:4,y:5}] },
            { start: {x: 5, y: 5, dir: 3}, goal: {x: 0, y: 0}, walls: [{x:4,y:5},{x:4,y:4},{x:4,y:3},{x:2,y:1},{x:2,y:2},{x:2,y:3},{x:0,y:1},{x:1,y:1}] }
        ];

        let currentLevelIndex = 0;
        let robot = { x: 0, y: 0, dir: 0 };
        let commands = [];
        let isRunning = false;
        const gridSize = 6;
        const maxCommands = 30;

        function initLevel() {
            const level = levels[currentLevelIndex];
            robot = { ...level.start };
            commands = [];
            isRunning = false;
            
            document.getElementById('level-display').innerText = `STAGE ${currentLevelIndex + 1} / ${levels.length}`;
            updateCommandUI();
            renderBoard();
            showMessage("INSERT COMMANDS TO REACH THE STAR 🌟", "text-yellow-300 neon-text-yellow");
        }

        function renderBoard() {
            const board = document.getElementById('game-board');
            board.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            board.innerHTML = '';
            
            const level = levels[currentLevelIndex];

            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    
                    const isWall = level.walls.some(w => w.x === x && w.y === y);
                    if (isWall) {
                        cell.classList.add('wall');
                        cell.innerText = '🧱'; // กำแพงเลเซอร์
                    }
                    
                    if (x === level.goal.x && y === level.goal.y) {
                        const starSpan = document.createElement('span');
                        starSpan.innerText = '🌟';
                        starSpan.className = 'goal';
                        cell.appendChild(starSpan);
                    }
                    
                    if (x === robot.x && y === robot.y) {
                        const botSpan = document.createElement('span');
                        botSpan.innerText = '👾'; // เปลี่ยนเป็นเอเลี่ยนอวกาศให้เข้าธีม หรือจะใช้ 🤖 ก็ได้
                        botSpan.className = `robot dir-${robot.dir}`;
                        cell.innerHTML = ''; 
                        cell.appendChild(botSpan);
                    }
                    
                    board.appendChild(cell);
                }
            }
        }

        function addCommand(cmd) {
            if (isRunning) return;
            if (commands.length >= maxCommands) {
                showMessage("MAX COMMANDS REACHED!", "text-red-400");
                return;
            }
            sounds.click();
            commands.push(cmd);
            updateCommandUI();
        }

        function clearCommands() {
            if (isRunning) return;
            sounds.click();
            commands = [];
            updateCommandUI();
        }

        function updateCommandUI() {
            const queue = document.getElementById('command-queue');
            const emptyText = document.getElementById('empty-queue-text');
            queue.innerHTML = '';
            
            if (commands.length === 0) {
                emptyText.style.display = 'block';
            } else {
                emptyText.style.display = 'none';
                commands.forEach((cmd, index) => {
                    const cmdEl = document.createElement('span');
                    let icon = '';
                    let styles = '';
                    
                    if (cmd === 'forward') { icon = '⬆️'; styles = 'bg-cyan-500 text-black border-cyan-300'; }
                    if (cmd === 'turn-left') { icon = '↺'; styles = 'bg-purple-600 text-white border-purple-400'; }
                    if (cmd === 'turn-right') { icon = '↻'; styles = 'bg-purple-600 text-white border-purple-400'; }
                    
                    cmdEl.className = `px-2 py-1 rounded border-2 font-bold text-sm ${styles} shadow-md`;
                    cmdEl.innerText = `${icon}`;
                    queue.appendChild(cmdEl);
                });
            }
        }

        function showMessage(msg, colorClass) {
            const msgBox = document.getElementById('message-box');
            msgBox.className = `text-center text-lg md:text-xl font-bold h-8 mb-4 ${colorClass}`;
            msgBox.innerText = msg;
        }

        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function resetLevelWithDelay(message) {
            sounds.lose();
            showMessage(message, "text-red-500");
            await delay(1500); 
            initLevel();       
        }

        async function runAlgorithm() {
            if (isRunning || commands.length === 0) return;
            isRunning = true;
            document.getElementById('run-btn').disabled = true;
            showMessage(">> EXECUTING PROGRAM...", "text-cyan-400 neon-text-cyan");

            const level = levels[currentLevelIndex];
            
            robot = { ...level.start };
            renderBoard();
            await delay(500);

            for (let i = 0; i < commands.length; i++) {
                const cmd = commands[i];
                
                if (cmd === 'forward') {
                    let nextX = robot.x;
                    let nextY = robot.y;
                    
                    if (robot.dir === 0) nextX++; 
                    if (robot.dir === 1) nextY++; 
                    if (robot.dir === 2) nextX--; 
                    if (robot.dir === 3) nextY--; 

                    if (nextX < 0 || nextX >= gridSize || nextY < 0 || nextY >= gridSize) {
                        renderBoard();
                        await resetLevelWithDelay("GAME OVER! OUT OF BOUNDS!");
                        document.getElementById('run-btn').disabled = false;
                        return;
                    }

                    const isWall = level.walls.some(w => w.x === nextX && w.y === nextY);
                    if (isWall) {
                        renderBoard();
                        await resetLevelWithDelay("CRASH! HIT A LASER WALL!");
                        document.getElementById('run-btn').disabled = false;
                        return;
                    }

                    robot.x = nextX;
                    robot.y = nextY;
                    sounds.move();

                } else if (cmd === 'turn-left') {
                    robot.dir = (robot.dir + 3) % 4; 
                    sounds.turn();
                } else if (cmd === 'turn-right') {
                    robot.dir = (robot.dir + 1) % 4; 
                    sounds.turn();
                }

                renderBoard();
                await delay(500); // ปรับจังหวะเดินให้กระชับขึ้นเล็กน้อยสำหรับธีมอาเขต
            }

            if (robot.x === level.goal.x && robot.y === level.goal.y) {
                sounds.win();
                showMessage("MISSION ACCOMPLISHED! 🎉", "text-green-400");
                await delay(2000);
                
                currentLevelIndex++;
                if (currentLevelIndex < levels.length) {
                    initLevel();
                } else {
                    showMessage("🏆 YOU WIN! ALL STAGES CLEARED!", "text-yellow-300 neon-text-yellow");
                    isRunning = false;
                }
            } else {
                await resetLevelWithDelay("MISSION FAILED! GOAL NOT REACHED!");
            }
            
            document.getElementById('run-btn').disabled = false;
        }

        initLevel();
    </script>
</body>
</html>
